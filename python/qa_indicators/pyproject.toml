[project]
name = "qa-indicators"
version = "0.1.0"
description = "Quant Academy indicator implementations and metadata registry"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "qa-core",
]

[tool.uv.sources]
qa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qa_indicators"]
