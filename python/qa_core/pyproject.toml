[project]
name = "qa-core"
version = "0.1.0"
description = "Quant Academy shared schemas, math utilities, and metric helpers"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10.0", "numpy>=2.1.0", "pandas>=2.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qa_core"]
