[project]
name = "qa-backtest"
version = "0.1.0"
description = "Quant Academy backtest adapters (vectorbt + future backtrader) + canonical preset library"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "vectorbt>=0.26",
    "qa-core",
    "qa-indicators",
]

[tool.uv.sources]
qa-core = { workspace = true }
qa-indicators = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qa_backtest"]
