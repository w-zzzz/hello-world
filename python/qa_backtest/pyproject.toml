[project]
name = "qa-backtest"
version = "0.1.0"
description = "Quant Academy backtest engine adapters (M5)"
requires-python = ">=3.12"
dependencies = ["qa-core"]

[tool.uv.sources]
qa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qa_backtest"]
